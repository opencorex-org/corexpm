name: Feature request
description: Propose a scoped product or compatibility improvement
title: "feat: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem independently of a preferred solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [CLI, resolver, registry, store, installer, lockfile, security, workspace, compatibility, documentation]
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Compatibility, security, and alternatives
    validations:
      required: true

