[workspace]
members = [
  "crates/corex-cli",
  "crates/corex-config",
  "crates/corex-core",
  "crates/corex-errors",
  "crates/corex-manifest",
  "crates/corex-semver",
  "crates/corex-graph",
  "crates/corex-registry",
  "crates/corex-resolver",
  "crates/corex-fetch",
  "crates/corex-cache",
  "crates/corex-store",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/opencorex-org/corexpm"
homepage = "https://github.com/opencorex-org/corexpm"
authors = ["OpenCorex contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
js-semver = "0.3"
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"
tempfile = "3.10"


