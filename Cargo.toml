[workspace]
members = [
  "crates/corex-cli",
  "crates/corex-config",
  "crates/corex-core",
  "crates/corex-errors",
  "crates/corex-manifest",
  "crates/corex-semver",
  "crates/corex-graph",
  "crates/corex-registry",
  "crates/corex-resolver",
  "crates/corex-fetch",
  "crates/corex-cache",
  "crates/corex-store",
  "crates/corex-linker",
  "crates/corex-installer",
  "crates/corex-lockfile",
  "crates/corex-policy",
  "crates/corex-scripts",
  "crates/corex-workspace",
  "crates/corex-audit",
  "crates/corex-security",
  "fuzz",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/opencorex-org/corexpm"
homepage = "https://github.com/opencorex-org/corexpm"
authors = ["OpenCorex contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
js-semver = "0.4"
sha2 = "0.11"
sha1 = "0.10"
flate2 = "1.0"
tar = "0.4"
hex = "0.4"
fs2 = "0.4"
tempfile = "3.10"
# Real HTTP client — sync, no runtime needed, TLS via native-tls
ureq = { version = "2.10", features = ["native-tls"] }
# Rich terminal progress bars and spinners
indicatif = "0.17"
# Terminal colors with NO_COLOR support
console = "0.15"



